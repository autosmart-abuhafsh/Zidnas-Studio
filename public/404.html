<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZIDNAS STUDIO — Jasa Foto &amp; Sewa Kebaya</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #171518;
        color: #f7f0e5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 440px;
        border: 1px solid rgba(197, 161, 90, 0.4);
        border-radius: 16px;
        padding: 32px;
        background: #1f1b1f;
      }
      h1 {
        font-weight: 500;
        color: #c5a15a;
        margin-top: 0;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 10px 20px;
        background: #651b32;
        color: #f7f0e5;
        text-decoration: none;
        border-radius: 8px;
        border: 1px solid rgba(197, 161, 90, 0.5);
        font-size: 14px;
      }
    </style>
    <script>
      // Redirect sub-route 404s on GitHub Pages back to the base repository URL
      (function () {
        var pathSegments = window.location.pathname.split('/').filter(Boolean);
        var repoBase =
          window.location.hostname.endsWith('github.io') && pathSegments.length > 0
            ? '/' + pathSegments[0] + '/'
            : '/';
        window.location.replace(repoBase);
      })();
    </script>
  </head>
  <body>
    <div class="card">
      <h1>ZIDNAS STUDIO · Jasa Foto &amp; Sewa Kebaya</h1>
      <p>Mengalihkan Anda kembali ke ruang galeri utama...</p>
      <a href="./">Kembali ke Beranda</a>
    </div>
  </body>
</html>
